<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JTI 雙園女子周日籃球聯盟</title>

  <style>
    body { margin: 0; font-family: sans-serif; background: #fafafa; }
    header { text-align: center; padding: 10px 0; background: #222; color: #fff; }

    /* 輪播 */
    .carousel { width: 100%; height: 300px; overflow: hidden; position: relative; }
    .carousel img { width: 100%; height: 300px; object-fit: cover; position: absolute; transition: opacity 1s; opacity: 0; }

    /* 主選單 */
    nav {
      display: flex;
      justify-content: center;
      background: #333;
      position: relative;      /* 保證 submenu 以 nav 為基準 */
      z-index: 5;             /* 讓 nav 站在輪播上方 */
    }

    nav button, nav a {
      flex: 1;
      padding: 12px;
      border: none;
      background: #333;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      text-decoration: none;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      white-space: nowrap; 
    }

    nav button:hover, nav a:hover { background: #444; }

    /* 讓 YouTube 連結保持其特色顏色 */
    nav a.youtube-link {
        background: #CC0000;
    }
    nav a.youtube-link:hover {
        background: #E60000;
    }

    /* 子選單 */
    .submenu {
      display: none; /* 預設隱藏 */
      background: #444;
      padding: 10px 0;
      position: absolute;
      width: 100%;
      left: 0;
      text-align: center;
      z-index: 4;
    }

    .submenu-inner {
      display: flex;
      justify-content: center;
      max-width: 800px;
      margin: 0 auto;
      gap: 10px; /* 按鈕間距 */
    }    

    .submenu button {
      color: #fff;
      background: #555;
      border: none;
      margin: 0 6px;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    .submenu button:hover { background: #666; }

    .content { padding: 15px; max-width: 1000px; margin: auto; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; background:white; }
    table th, table td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    table th { background: #eee; font-weight: bold; }

    h3 { margin-top: 0; }

    /* 🌟 最新消息列表樣式 */
    .news-item {
        padding: 10px;
        margin-bottom: 10px;
        border-left: 5px solid #6c757d;
        background: #f0f0f0;
        border-radius: 4px;
    }
    .news-item.urgent {
        border-left: 5px solid #333;
        background: #e8e8e8;
    }
    .news-subject { font-weight: bold; color: #333; margin-bottom: 5px; }
    .news-date { font-size: 0.8em; color: #6c757d; display: block; margin-bottom: 5px; }
    .news-link { color: #495057; font-weight: bold; text-decoration: none; }
    .news-link:hover { text-decoration: underline; }

    /* 最新消息分頁樣式 - 統一深色風格 */
    .pagination {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
    }

    .pagination button {
        padding: 8px 18px;
        cursor: pointer;
        background-color: #333; /* 配合導覽列深色 */
        color: #fff;
        border: none;
        border-radius: 6px; /* 配合子選單圓角 */
        font-size: 15px;
        transition: background 0.3s;
    }

    .pagination button:hover:not(:disabled) {
        background-color: #555; /* 懸停時變淺 */
    }

    .pagination button:disabled {
        cursor: not-allowed;
        background-color: #ccc;
        color: #888;
    }

    .pagination span {
        font-size: 14px;
        color: #666;
        font-weight: bold;
    }

    /* ===== Footer 聯絡我們 ===== */
    footer {
    background: #222;
    padding: 20px 0;
    text-align: center;
    margin-top: 30px;
    border-top: 1px solid #444;
  }
  
  .footer-btn {
    display: inline-block;
    padding: 10px 25px;
    background: #555;
    color: #fff;
    text-decoration: none; /* 移除超連結底線 */
    border-radius: 4px;
    transition: background 0.3s;
  }

  .footer-btn:hover {
    background: #777;
    color: #fff;
  }

  </style>
</head>

<body>

 <!-- 輪播 -->
  <div class="carousel" id="carousel"></div>

  <header>
    <h2>JTI雙園女子周日籃球聯盟</h2>
  </header>

  <!-- ⭐ 主選單 -->
  <nav>
    <button onclick="showPage('news')">最新消息</button>

    <!-- ⭐ 新增：賽程戰績子選單觸發 -->
    <button onclick="toggleSubmenu()">賽程戰績</button>

    <button onclick="showPage('history')">歷屆成績</button>

    <!-- ⭐ YouTube Icon（變成紅色 icon） -->
    <a href="https://www.youtube.com/@MCChuang" target="_blank" rel="noopener noreferrer">
      ▶️ 賽事頻道
    </a>
  </nav>

  <!-- ⭐ 子選單（折疊式） -->
  <div class="submenu" id="submenu">
    <button onclick="showPage('schedule')">本季賽程</button>
    <button onclick="showPage('standing')">目前戰績</button>
    <button onclick="showPage('teams')">隊伍查詢</button>
  </div>

  <div class="content" id="contentArea"></div>

  <!-- ===== 聯絡我們 Footer（永遠顯示） ===== -->
  <footer id="contactFooter">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSekvVeWOqWa6XdZgVq5kSCSkK-Ktff_llCzUUwc-CCpGAlECA/viewform" target="_blank" rel="noopener noreferrer" class="footer-btn">
      聯絡我們
    </a>
  </footer>

<script>
  
// 🌟 Google Sheets（你的 CSV 連結）
const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vSzlWpX-5ItN9NwZf_ybV-5gPg-nScM7z-rSXW1rKEsWi_-M6E6LBe8mw8MeEwFSrUhfjmkQeoI3irM/pub?output=csv";
const HISTORY_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQoTn408A02uDUaRJivPlAs7fRUloehRNYpTv9HO3IOo1BVa7-3T5lUMvhciq3LgI_NToyzVIoEOOuK/pub?output=csv";
const NEWS_CSV_URL = 
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9QLXDF53keZ4-LHoI-1lZ3E2bal37MtsjVy4l0D4wFpFoMD3yURwikst61JhwYjiwGnaXVGdUOWN-/pub?output=csv";    

// 🌟 輪播（自動載入 assets/1.jpg ~ assets/20.jpg）
const carouselDiv = document.getElementById("carousel");
let carouselIndex = 0;
const carouselImages = [];

const MAX_IMAGES = 20; // 你預期最多放幾張

for (let i = 1; i <= MAX_IMAGES; i++) {
  const img = document.createElement("img");
  img.src = `assets/${i}.jpg`;

  img.onload = () => {
    if (carouselImages.length === 0) {
      img.style.opacity = 1;
    }
    carouselDiv.appendChild(img);
    carouselImages.push(img);
  };

  // 如果圖片不存在，直接忽略
  img.onerror = () => {};
}

setInterval(() => {
  if (carouselImages.length <= 1) return;

  carouselImages[carouselIndex].style.opacity = 0;
  carouselIndex = (carouselIndex + 1) % carouselImages.length;
  carouselImages[carouselIndex].style.opacity = 1;
}, 3000);


// 🌟 主/子選單 toggle
function toggleSubmenu() {
  const menu = document.getElementById("submenu");
  menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

// ⭐ 🌟主頁切換（你的原始功能）修改 showPage 函式確保切換時重設頁碼
function showPage(page) {
  // 收起子選單
  document.getElementById("submenu").style.display = "none";
  if (page === "news") {
      currentNewsPage = 1; // 每次回到最新消息頁面都從第 1 頁開始
      renderNews();
  }
  if (page === "schedule") renderSchedule();
  if (page === "standing") renderStanding();
  if (page === "teams") renderTeamSearch();
  if (page === "history") renderHistory();
  if (page === "contact") renderContact();
}

// 🌟 讀取 CSV
async function fetchCSV() {
  const res = await fetch(CSV_URL);
  const text = await res.text();
  return text.split(/\r?\n/).map(r => r.split(","));
}

// ====================================================================
// ⭐ 0）最新消息
// ====================================================================
// 🌟 1. 定義全域變數
let allNewsData = [];      // 用於暫存從 CSV 抓取的完整消息資料
let currentNewsPage = 1;   // 目前頁碼
const newsPerPage = 3;     // 每頁顯示幾筆

// 🌟 2. 渲染最新消息
async function renderNews() {
    const contentArea = document.getElementById("contentArea");

    // 如果暫存陣列是空的，才執行抓取動作
    if (allNewsData.length === 0) {
        contentArea.innerHTML = "<p>正在載入最新消息...</p>";
        try {
            const res = await fetch(NEWS_CSV_URL);
            const text = await res.text();
            const rows = text.split(/\r?\n/).map(r => r.split(","));
            
            // 轉換為物件陣列並過濾標題列與空行
            allNewsData = rows.slice(1).map(r => ({
                date: r[0],
                subject: r[1],
                content: r[2],
                link: r[3],
                isUrgent: r[4] === "TRUE" || r[4] === "true",
                photo: r[5]
            })).filter(item => item.date);
        } catch (error) {
            console.error("抓取 CSV 失敗:", error);
            contentArea.innerHTML = "<p>載入失敗，請確認網路連線或試算表發布設定。</p>";
            return;
        }
    }

    // 3. 計算分頁
    const startIndex = (currentNewsPage - 1) * newsPerPage;
    const endIndex = startIndex + newsPerPage;
    const paginatedItems = allNewsData.slice(startIndex, endIndex);
    const totalPages = Math.ceil(allNewsData.length / newsPerPage);

    // 4. 產生內容 HTML
    let newsHtml = '<h3>最新消息</h3>';
    
    if (paginatedItems.length === 0) {
        newsHtml += "<p>目前尚無消息。</p>";
    } else {
        paginatedItems.forEach(item => {
            const urgencyClass = item.isUrgent ? ' urgent' : '';
            let linkHtml = item.link ? `<a href="${item.link}" target="_blank" rel="noopener noreferrer" class="news-link">[查看詳情...]</a>` : '';

            // 💡 調整一：限制最大寬度（例如改為 300px，可依需求自行調整）並加上 margin 留白
            let photoHtml = item.photo
            ? `<div style="margin: 10px 0;"><img src="${item.photo}" style="max-width:600px; width:100%; border-radius:8px;"></div>`
            : "";
            
            // 💡 調整二：重新排列順序：日期 -> 標題 -> 內文 -> 圖片 -> 超連結
            newsHtml += `
                <div class="news-item${urgencyClass}">
                    <span class="news-date">${item.date}</span>
                    <div class="news-subject">${item.subject}</div>

                    <p>${item.content}</p>

                    ${photoHtml}

                    ${linkHtml}
                </div>
            `;
        });
    }

    // 5. 產生分頁按鈕 (只有資料筆數大於每頁限制才顯示)
    if (allNewsData.length > newsPerPage) {
        newsHtml += `
            <div class="pagination">
                <button onclick="changeNewsPage(${currentNewsPage - 1})" ${currentNewsPage === 1 ? 'disabled' : ''}>上一頁</button>
                <span>第 ${currentNewsPage} / ${totalPages} 頁</span>
                <button onclick="changeNewsPage(${currentNewsPage + 1})" ${currentNewsPage === totalPages ? 'disabled' : ''}>下一頁</button>
            </div>
        `;
    }
    
    contentArea.innerHTML = newsHtml;
}

// 🌟 6. 切換頁碼函式
function changeNewsPage(newPage) {
    currentNewsPage = newPage;
    renderNews(); // 重新渲染畫面，此時不會再 fetch，會直接從 allNewsData 拿資料
    window.scrollTo(0, 0); // 回到頂部方便閱讀
}

// ====================================================================
// ⭐ 1）賽程表
// ====================================================================
function toYYYYMM(dateStr) {
  return dateStr.slice(0, 6);
}

function parseDate(d) {
  return new Date(d.replace(/\//g, "-"));
}

async function renderSchedule() {
  const rows = await fetchCSV();
  const headers = rows[0];
  const SHOW = 8;

  let data = rows.slice(1)
    .filter(r => r.length > 1)
    .filter(r => (r[8] || "Y").trim() === "Y");

  data.sort((a, b) => parseDate(a[0]) - parseDate(b[0]));

  const months = [...new Set(data.map(r => toYYYYMM(r[0])))];
  const groups = [...new Set(data.map(r => r[3]))];

  let html = `
  <h3>賽程表</h3>

  <label>
  月份：
  <select id="monthFilter" onchange="filterSchedule()">
    <option value="all">全部</option>
  `;

  months.forEach(m => {
    html += `<option value="${m}">${m}</option>`;
  });

  html += `
  </select>
  </label>

  <label style="margin-left:15px;">
  組別：
  <select id="groupFilter" onchange="filterSchedule()">
    <option value="all">全部</option>
  `;

  groups.forEach(g => {
    html += `<option value="${g}">${g}</option>`;
  });

  html += `
  </select>
  </label>
  `;

  const DISPLAY_COLUMNS = [0,1,2,3,4,5,6,7];
  html += `
    <table id="scheduleTable">
      <thead>
        <tr>
          ${DISPLAY_COLUMNS.map(i => `<th>${headers[i]}</th>`).join("")}
        </tr>
      </thead>
      <tbody>
  `;

  data.forEach(r => {
    const row = [...r];
    row[0] = formatDateYYYYMMDD(row[0]); // ⭐ 只格式化「日期欄位」
    row[1] = formatTimeMMSS(row[1]);     // ⭐ 時間
    html += `
      <tr>
        ${DISPLAY_COLUMNS.map(i => `<td>${row[i]}</td>`).join("")}
      </tr>
    `;
});

  html += `</tbody></table>`;

  document.getElementById("contentArea").innerHTML = html;

  window.fullSchedule = data;
}

function filterSchedule() {
  const month = document.getElementById("monthFilter").value;
  const group = document.getElementById("groupFilter").value;

  const tbody = document.querySelector("#scheduleTable tbody");

  tbody.innerHTML = "";

  window.fullSchedule.forEach(r => {

    const matchMonth =
      month === "all" || toYYYYMM(r[0]) === month;

    const matchGroup =
      group === "all" || r[3] === group;

    if (matchMonth && matchGroup) {

      const row = [...r];

      row[0] = formatDateYYYYMMDD(row[0]);
      row[1] = formatTimeMMSS(row[1]);

      tbody.innerHTML += `
      <tr>
        ${row.slice(0,8).map(x => `<td>${x}</td>`).join("")}
      </tr>
      `;
    }
  });
}


// ⭐ 日期格式化：YYYYMMDD → YYYY/MM/DD
function formatDateYYYYMMDD(dateStr) {
  if (!dateStr || dateStr.length !== 8) return dateStr;
  return `${dateStr.slice(0,4)}/${dateStr.slice(4,6)}/${dateStr.slice(6,8)}`;
}

// ⭐ 時間格式化：mmSS → mm:SS
function formatTimeMMSS(timeStr) {
  if (!timeStr || timeStr.length !== 4) return timeStr;
  return `${timeStr.slice(0,2)}:${timeStr.slice(2,4)}`;
}

// ====================================================================
// ⭐ 2）目前戰績（你新增的頁面）
// ====================================================================
async function renderStanding() {
  const rows = await fetchCSV();
  const SHOW = 8;

  const data = rows.slice(1)
    .filter(r => r.length > 1)
    .filter(r => (r[8] || "Y").trim() === "Y");

  // 欄位：日期、時間、組別、隊伍淺、隊伍深、比數、勝隊
  const DATE = 0;
  const TIME = 1;
  const COURT = 2;
  const GROUP = 3;
  const LIGHT = 4;
  const DARK = 5;
  const SCORE = 6;
  const WINNER = 7;

  // 🔥 找出所有隊伍、依組別分類
  const groupTeams = { A: new Set(), B: new Set(), C: new Set() };

  data.forEach(r => {
    const g = r[GROUP]?.trim();

    if (g === "A組") {
      groupTeams.A.add(r[LIGHT]);
      groupTeams.A.add(r[DARK]);
    }
    else if (g === "B組") {
      groupTeams.B.add(r[LIGHT]);
      groupTeams.B.add(r[DARK]);
    }
    else if (g === "C組") {
      groupTeams.C.add(r[LIGHT]);
      groupTeams.C.add(r[DARK]);
    }
  });

  // 轉成物件格式紀錄戰績
  function initStanding(teams) {
    const obj = {};
    teams.forEach(t => {
      obj[t] = { played: 0, win: 0, lose: 0, draw: 0 };
    });
    return obj;
  }

  const standingA = initStanding(groupTeams.A);
  const standingB = initStanding(groupTeams.B);
  const standingC = initStanding(groupTeams.C);

  // 🔥 計算戰績
  data.forEach(r => {
    const g = r[GROUP].trim();
    const light = r[LIGHT];
    const dark = r[DARK];
    const winner = r[WINNER].trim();
    if (!winner) { // 如果勝隊欄位為空、null、undefined，則跳過此場比賽
      return; // 繼續下一個迴圈
    }else if(g != 'A組' || g != 'B組' || g != 'C組'){
      return; // 繼續下一個迴圈
    }

    let target;

    if (g === "A組") {
      target = standingA;
    }
    else if (g === "B組") {
      target = standingB;
    }
    else if (g === "C組") {
      target = standingC;
    }
    else {
      return;
    }

    target[light].played++;
    target[dark].played++;

    if (winner === "平手") {
      target[light].draw++;
      target[dark].draw++;
    } else {
      target[winner].win++;
      const loser = winner === light ? dark : light;
      target[loser].lose++;
    }
  });

  // 🔥 生成表格 HTML
  function buildTable(title, obj) {
    let html = `<h3>${title}</h3>`;
    html += `<table><thead>
      <tr><th>隊伍名稱</th><th>已賽場數</th><th>勝場數</th><th>敗場數</th><th>平手場數</th></tr>
    </thead><tbody>`;

// 1. 取得所有隊伍名稱 (鍵)
  const teams = Object.keys(obj);

  // 2. 進行複雜排序
  teams.sort((a, b) => {
    const sA = obj[a]; // 隊伍 A 的戰績
    const sB = obj[b]; // 隊伍 B 的戰績

    // --- 規則 1: 勝場數多的先 (降序) ---
    if (sA.win !== sB.win) {
      return sB.win - sA.win; // B - A: 如果 B 比較大 (勝場多)，回傳正數，B 排在前面
    }

    // --- 規則 2: 已賽數多的先 (降序) ---
    if (sA.played !== sB.played) {
      return sB.played - sA.played; // B - A: 如果 B 比較大 (已賽多)，回傳正數，B 排在前面
    }

    // --- 規則 3: 隊名按筆畫小到大排序 (升序) ---
    // 使用 String.prototype.localeCompare 進行中文筆畫/字典序排序
    // 預設就是升序 (小的在前面)，如果 a 應該在 b 前面，回傳負數
    return a.localeCompare(b, 'zh-Hans-TW', { sensitivity: 'base' });
  });

  // 3. 按照排序好的 teams 陣列來生成 HTML
  teams.forEach(t => {
    const s = obj[t];
    html += `<tr>
      <td>${t}</td>
      <td>${s.played}</td>
      <td>${s.win}</td>
      <td>${s.lose}</td>
      <td>${s.draw}</td>
    </tr>`;
  });

    html += `</tbody></table>`;
    return html;
  }

  document.getElementById("contentArea").innerHTML =
    buildTable("A 組目前戰績", standingA) +
    "<br>" +
    buildTable("B 組目前戰績", standingB) +
    "<br>" +
    buildTable("C 組目前戰績", standingC);
}



// ====================================================================
// ⭐ 3）戰績查詢（筆畫排序）
// ====================================================================
async function renderTeamSearch() {
  const rows = await fetchCSV();
  const SHOW = 8;

  const data = rows.slice(1)
    .filter(r => (r[8] || "Y").trim() === "Y");

  const teams = [...new Set(data.flatMap(r => [r[4], r[5]]))].filter(Boolean);

  teams.sort((a, b) => a.localeCompare(b, "zh-Hant"));

  let html = `<h3>隊伍查詢</h3>`;

  html += `
    <label>選擇隊伍：
      <select id="teamSelect" onchange="filterTeam()">
        <option value="">請選擇</option>
  `;

  teams.forEach(t => (html += `<option value="${t}">${t}</option>`));

  html += `</select></label><div id="teamResult"></div>`;

  document.getElementById("contentArea").innerHTML = html;

  window.fullData = data;
}

function filterTeam() {
  const team = document.getElementById("teamSelect").value;
  const result = document.getElementById("teamResult");

  result.innerHTML = "";
  if (!team) return;

  const rows = window.fullData.filter(r => r[4] === team || r[5] === team);

  let html = `
    <table>
      <thead>
        <tr>
          <thead>
            <tr>
              <th>日期</th>
              <th>時間</th>
              <th>場地</th>
              <th>組別</th>
              <th>隊伍淺</th>
              <th>隊伍深</th>
              <th>比數</th>
              <th>勝隊</th>
            </tr>
        </thead>
        </tr>
      </thead>
      <tbody>
  `;

  rows.forEach(r => {
    const row = [...r];
    row[0] = formatDateYYYYMMDD(row[0]); // ⭐ 日期格式化
    row[1] = formatTimeMMSS(row[1]);     // ⭐ 時間
    const DISPLAY_COLUMNS = [0,1,2,3,4,5,6,7];
    html += `
      <tr>
        ${DISPLAY_COLUMNS.map(i => `<td>${row[i]}</td>`).join("")}
      </tr>
    `;
  });


  html += `</tbody></table>`;
  result.innerHTML = html;
}


// ====================================================================
// ⭐ 4）載入歷屆成績
// ====================================================================
// 主畫面載入歷屆成績
async function renderHistory() {
    const content = document.getElementById("contentArea");

    content.innerHTML = `
        <h3>歷屆成績</h3>
        <label>選擇賽季：
            <select id="historySelect" onchange="loadHistorySeason()"></select>
        </label>
        <div id="historyResult" style="margin-top: 15px;"></div>
    `;

    await loadHistorySeasonList();
}

// 讀取 Google Sheet CSV → 建立賽季下拉選單
async function loadHistorySeasonList() {
    const res = await fetch(HISTORY_CSV_URL);
    const text = await res.text();

    const rows = text.split(/\r?\n/).map(r => r.split(","));
    const data = rows.slice(1).filter(r => r.length > 1);

    /*
      欄位假設：
      [0] 排序碼（202601）
      [1] 賽季文字（2026第一季）
      [2] 組別
      [3] 獎項
      [4] 隊伍
    */

    // 建立 Map：排序碼 → 賽季名稱（避免重複）
    const seasonMap = new Map();
    data.forEach(r => {
        seasonMap.set(r[0], r[1]);
    });

    // 依排序碼「數字大到小」排序
    const sortedKeys = [...seasonMap.keys()]
        .map(k => Number(k))
        .sort((a, b) => b - a);

    const select = document.getElementById("historySelect");
    select.innerHTML = "";

    sortedKeys.forEach(key => {
        const opt = document.createElement("option");
        opt.value = key;                  // 用排序碼當 value
        opt.textContent = seasonMap.get(String(key)); // 顯示賽季文字
        select.appendChild(opt);
    });

    // 預設載入最新一季（排序後第一筆）
    loadHistorySeason();
}

// 顯示特定賽季的 A、B 組成績
async function loadHistorySeason() {
    const seasonKey = document.getElementById("historySelect").value;

    const res = await fetch(HISTORY_CSV_URL);
    const text = await res.text();

    const rows = text.split(/\r?\n/).map(r => r.split(","));
    const headers = rows[0].slice(1); // ❗不顯示排序碼欄
    const data = rows.slice(1).filter(r => r.length > 1);

    // 篩選該賽季（用排序碼）
    const filtered = data.filter(r => r[0] === seasonKey);

    // A / B 組
    const A = filtered.filter(r => r[2] === "A組");
    const B = filtered.filter(r => r[2] === "B組");

    let html = "";

    function makeTable(title, rows) {
        if (rows.length === 0) return "";

        return `
            <h3>${title}</h3>
            <table>
                <thead>
                    <tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr>
                </thead>
                <tbody>
                    ${rows
                        .map(r => `
                            <tr>
                                ${r.slice(1).map(x => `<td>${x}</td>`).join("")}
                            </tr>
                        `)
                        .join("")}
                </tbody>
            </table>
            <br>
        `;
    }

    html += makeTable("A 組成績", A);
    html += makeTable("B 組成績", B);

    document.getElementById("historyResult").innerHTML = html;
}
